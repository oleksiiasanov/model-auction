  ttl_hours: 24  # Cache validity in hours, 0 = never expire

# Reporting
reporting:
  output_directory: "outputs"
  decimal_places: 2
  currency_unit: "AZN"  # Change based on country

# Cleanup
cleanup:
  keep_last_runs: 5  # Number of recent simulation runs to keep when cleaning outputs

# Simulation Logging (detailed event tracking)
logging:
  # Enable detailed simulation logging
  simulation_log_enabled: true

  # Log format: jsonl, text, or both
  log_format: "both"

  # Number of top winners to log per batch
  log_top_n_winners: 10

  # Track pressure changes between batches
  log_pressure_changes: false

  # Log pacing gate events
  log_pacing_events: true  # Enable to track pacing gate blocks

  # Log budget exhaustion events
  log_budget_events: true  # Enable to track budget exhaustion

# Python Logging
python_logging:
  level: "INFO"  # DEBUG, INFO, WARNING, ERROR
  format: "json"  # json or text
  file: "simulation.log"
